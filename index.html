<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <h1>โปรเจกต์ของฉัน</h1>
  <p class="lede">ตัวอย่าง prototype: กดปุ่มเพื่อเปิด modal ยืนยันการลบ</p>
  <button class="btn danger" id="open">ลบโปรเจกต์</button>
  <p class="status" id="status" role="status"></p>
</main>

<div class="backdrop" id="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">ลบโปรเจกต์ “ร้านกาแฟบ้านสวน”?</h2>
    <p>ไฟล์และการแชร์ทั้งหมดจะถูกลบถาวร กู้คืนไม่ได้</p>
    <div class="actions">
      <button class="btn ghost" id="cancel">ยกเลิก</button>
      <button class="btn danger" id="confirm">ลบโปรเจกต์</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
